<div class="admin-dashboard-container">
  <h1>Submission Dashboard</h1>
  
  <mat-tab-group>
    <mat-tab label="Pending Approvals">
      @if (submissionService.pendingSubmissions()) {
        <table mat-table [dataSource]="submissionService.pendingSubmissions()" class="mat-elevation-z8">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef>Title</th>
            <td mat-cell *matCellDef="let submission">{{submission.content.title}}</td>
          </ng-container>

          <ng-container matColumnDef="type">
            <th mat-header-cell *matHeaderCellDef>Type</th>
            <td mat-cell *matCellDef="let submission">{{submission.type}}</td>
          </ng-container>

          <ng-container matColumnDef="submittedBy">
            <th mat-header-cell *matHeaderCellDef>Submitted By</th>
            <td mat-cell *matCellDef="let submission">{{submission.submittedBy}}</td>
          </ng-container>

          <ng-container matColumnDef="submittedDate">
            <th mat-header-cell *matHeaderCellDef>Submitted Date</th>
            <td mat-cell *matCellDef="let submission">{{submission.submittedDate | date}}</td>
          </ng-container>

          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Actions</th>
            <td mat-cell *matCellDef="let submission">
              <button mat-button color="primary" [routerLink]="['/submissions', submission.id]">
                Review
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      } @else {
        <mat-spinner></mat-spinner>
      }
    </mat-tab>

    <mat-tab label="All Submissions">
      @if (submissionService.submissions()) {
        <table mat-table [dataSource]="submissionService.submissions()" class="mat-elevation-z8">
          <!-- Same columns as above -->
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      } @else {
        <mat-spinner></mat-spinner>
      }
    </mat-tab>
  </mat-tab-group>
</div>
