
@if (prompt && !isLoading) {
  <div>
    <button mat-stroked-button (click)="goBack()" class="back-button">
      <mat-icon>arrow_back</mat-icon>
      Back to List
    </button>
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ prompt.title }}</mat-card-title>
        <mat-card-subtitle>
          By {{ prompt.author }} | Language: {{ prompt.language }} | Category: {{ prompt.category }}
        </mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p class="description">{{ prompt.description }}</p>
        <h4>Tags</h4>
        <mat-chip-listbox aria-label="Prompt tags">
          @for (tag of prompt.tags; track trackByTag($index, tag)) {
            <mat-chip disabled color="accent">{{ tag }}</mat-chip>
          }
        </mat-chip-listbox>
        <h4>Prompt Text</h4>
        <app-code-editor
          [content]="prompt.prompt"
          [fileName]="prompt.title + '.txt'"
          [language]="'text'"
          [showEditButton]="true"
          [showCopyButton]="true"
          [placeholder]="'Enter your prompt text here...'"
          [minRows]="8"
          [maxRows]="20"
          [isEditMode]="isEditMode"
          (contentChange)="onContentChange($event)"
          (editStart)="toggleEditMode()"
          (editSave)="applyInlineChanges()"
          (editCancel)="toggleEditMode()"
          (copyToClipboard)="copyToClipboard()">
        </app-code-editor>
      </mat-card-content>
      <mat-card-actions align="end">
        <!-- Display mode buttons -->
        @if (!isEditMode) {
          <div class="display-buttons">
            <button mat-button (click)="editPrompt(prompt.id)">
              <mat-icon>edit</mat-icon>
              Edit Full
            </button>
            <button mat-flat-button color="primary" (click)="copyToClipboard()">
              <mat-icon>content_copy</mat-icon>
              Copy Prompt
            </button>
          </div>
        }
      </mat-card-actions>
    </mat-card>
  </div>
} @else {
  <div class="spinner-container">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </div>
}
