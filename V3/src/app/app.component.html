
<mat-toolbar color="primary">
  <span class="brand brand-right" routerLink="/">
    <span class="brand-title">Copilot Prompter</span>
    <!-- <span class="brand-subtitle">by Shaleen Kumar</span> -->
  </span>
  
  <div class="nav-links">
    <button mat-button routerLink="/prompts" routerLinkActive="active-link">
      <mat-icon>code</mat-icon>
      Prompts
    </button>
    <button mat-button routerLink="/templates" routerLinkActive="active-link">
      <mat-icon>settings</mat-icon>
      Templates
    </button>
  </div>
  
  <span class="toolbar-spacer"></span>
  
  <div class="action-buttons">
    <button mat-raised-button color="accent" routerLink="/create">
      <mat-icon>add</mat-icon>
      New Prompt
    </button>
    <button mat-stroked-button routerLink="/templates/create" class="template-btn">
      <mat-icon>build</mat-icon>
      New Template
    </button>
  </div>
</mat-toolbar>

<main class="main-content">
  <router-outlet></router-outlet>
</main>
