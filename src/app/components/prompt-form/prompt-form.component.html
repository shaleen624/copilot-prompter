<div class="form-container">
  <button mat-stroked-button (click)="goBack()" class="back-button">
    <mat-icon>arrow_back</mat-icon>
    Back to List
  </button>

  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ isEditMode ? 'Edit Prompt' : 'Create New Prompt' }}</mat-card-title>
    </mat-card-header>

    <form [formGroup]="promptForm" (ngSubmit)="onSubmit()">
      <mat-card-content>
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Title</mat-label>
          <input matInput formControlName="title" placeholder="Enter prompt title" required>
          <mat-error *ngIf="promptForm.get('title')?.hasError('required')">
            Title is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Description</mat-label>
          <textarea matInput formControlName="description" placeholder="Enter prompt description" rows="3" required>
          </textarea>
          <mat-error *ngIf="promptForm.get('description')?.hasError('required')">
            Description is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Prompt Text</mat-label>
          <textarea matInput formControlName="prompt" placeholder="Enter your prompt" rows="6" required>
          </textarea>
          <mat-error *ngIf="promptForm.get('prompt')?.hasError('required')">
            Prompt text is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Category</mat-label>
          <mat-select formControlName="category" required>
            <mat-option *ngFor="let category of categories" [value]="category">
              {{category}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="promptForm.get('category')?.hasError('required')">
            Category is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Language</mat-label>
          <mat-select formControlName="language" required>
            <mat-option *ngFor="let language of languages" [value]="language">
              {{language}}
            </mat-option>
          </mat-select>
          <mat-error *ngIf="promptForm.get('language')?.hasError('required')">
            Language is required
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Tags</mat-label>
          <mat-chip-grid #chipGrid aria-label="Tag selection">
            <mat-chip-row *ngFor="let tag of tags"
              (removed)="removeTag(tag)">
              {{tag}}
              <button matChipRemove [attr.aria-label]="'remove ' + tag">
                <mat-icon>cancel</mat-icon>
              </button>
            </mat-chip-row>
            <input placeholder="New tag..."
                   [matChipInputFor]="chipGrid"
                   [matChipInputSeparatorKeyCodes]="separatorKeysCodes"
                   (matChipInputTokenEnd)="addTag($event)">
          </mat-chip-grid>
        </mat-form-field>

      </mat-card-content>

      <mat-card-actions align="end">
        <button mat-button type="button" (click)="goBack()">Cancel</button>
        <button mat-flat-button color="primary" type="submit" [disabled]="!promptForm.valid">
          {{ isEditMode ? 'Update' : 'Create' }}
        </button>
      </mat-card-actions>
    </form>
  </mat-card>
</div>
