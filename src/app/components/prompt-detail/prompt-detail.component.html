
<div *ngIf="prompt$ | async as prompt; else loading">
  <button mat-stroked-button (click)="goBack()" class="back-button">
    <mat-icon>arrow_back</mat-icon>
    Back to List
  </button>
  <mat-card>
    <mat-card-header>
      <mat-card-title>{{ prompt.title }}</mat-card-title>
      <mat-card-subtitle>
        By {{ prompt.author }} | Language: {{ prompt.language }} | Category: {{ prompt.category }}
      </mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p class="description">{{ prompt.description }}</p>
      
      <h4>Tags</h4>
      <mat-chip-listbox aria-label="Prompt tags">
        <mat-chip *ngFor="let tag of prompt.tags" disabled color="accent">{{ tag }}</mat-chip>
      </mat-chip-listbox>

      <h4>Prompt Text</h4>
      <pre class="prompt-code"><code>{{ prompt.prompt }}</code></pre>
    </mat-card-content>
    <mat-card-actions align="end">
      <button mat-button (click)="editPrompt(prompt.id)">
        <mat-icon>edit</mat-icon>
        Edit
      </button>
      <button mat-flat-button color="primary" (click)="copyPrompt(prompt.prompt)">
        <mat-icon>content_copy</mat-icon>
        Copy Prompt
      </button>
    </mat-card-actions>
  </mat-card>
</div>

<ng-template #loading>
  <div class="spinner-container">
    <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
  </div>
</ng-template>
