<div class="prompt-list-container">
  <div class="filters-container">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search prompts</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Search by title, description, or tags">
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="filter-row">
      <mat-form-field appearance="outline">
        <mat-label>Category</mat-label>
        <mat-select [formControl]="categoryControl">
          <mat-option value="">All Categories</mat-option>
          <mat-option *ngFor="let category of categories" [value]="category">
            {{category}}
          </mat-option>
        </mat-select>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Language</mat-label>
        <mat-select [formControl]="languageControl">
          <mat-option value="">All Languages</mat-option>
          <mat-option *ngFor="let lang of languages" [value]="lang">
            {{lang}}
          </mat-option>
        </mat-select>
      </mat-form-field>
    </div>
  </div>

  <div class="prompts-grid" *ngIf="filteredPrompts$ | async as prompts; else loading">
    <mat-card *ngFor="let prompt of prompts" class="prompt-card" [routerLink]="['/prompts', prompt.id]">
      <mat-card-header>
        <mat-card-title>{{ prompt.title }}</mat-card-title>
        <mat-card-subtitle>{{ prompt.language }} | {{ prompt.category }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ prompt.description }}</p>
        <mat-chip-listbox aria-label="Prompt tags">
          <mat-chip *ngFor="let tag of prompt.tags" [color]="'accent'" [disabled]="true">
            {{ tag }}
          </mat-chip>
        </mat-chip-listbox>
      </mat-card-content>
    </mat-card>
  </div>

  <ng-template #loading>
    <div class="spinner-container">
      <mat-progress-spinner mode="indeterminate"></mat-progress-spinner>
    </div>
  </ng-template>
</div>
