# Database Configuration - SQLite
spring.datasource.url=jdbc:sqlite:./data/copilot_prompter.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# CORS Configuration
cors.allowed-origins=http://localhost:4200,http://localhost:8080
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.allowed-headers=*
cors.allow-credentials=true

# JWT Configuration
jwt.secret=YourVerySecretKeyThatShouldBeAtLeast32CharactersLongForSecurity
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# Actuator Configuration
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# Logging Configuration
logging.level.com.copilotprompter=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Application Configuration
app.name=Copilot Prompter Backend
app.version=1.0.0
app.admin.default-username=admin
app.admin.default-password=admin123

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Server Configuration
server.port=8080
server.servlet.context-path=/api

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
springdoc.swagger-ui.use-root-path=false
springdoc.show-actuator=true
springdoc.swagger-ui.disable-swagger-default-url=true
springdoc.group-configs[0].group=public
springdoc.group-configs[0].paths-to-match=/auth/**,/prompts/**,/templates/**,/actuator/**
springdoc.group-configs[1].group=admin
springdoc.group-configs[1].paths-to-match=/admin/**
