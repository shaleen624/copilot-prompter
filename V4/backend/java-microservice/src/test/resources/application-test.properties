# Test Configuration
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=false

# JWT Configuration for testing
jwt.secret=TestSecretKeyForJunitTesting123456789
jwt.expiration=3600000
jwt.refresh-expiration=7200000

# Admin Configuration for testing
app.admin.default-username=testadmin
app.admin.default-password=testpass

# Logging
logging.level.com.copilotprompter=DEBUG
logging.level.org.springframework.security=WARN
